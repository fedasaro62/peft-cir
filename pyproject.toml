[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peft-cir"
version = "0.1.0"
description = "A parameter-efficient fine-tuning benchmark for CLIP-based composed image retrieval"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

# Runtime dependencies are NOT declared here on purpose. Each architecture runs in its own
# virtualenv built from `requirements.txt`, which pins a trio (transformers 4.34.1 /
# huggingface_hub 0.17.3 / accelerate 0.30.1) that a resolver left to itself gets wrong --
# see the comments there. `pip install -e .` adds this package to whichever venv is active
# without touching those pins.
dependencies = []

[dependency-groups]
dev = ["ruff >= 0.9.0"]
test = ["coverage >= 7.3.0", "pytest >= 7.4.0", "pytest-cov >= 4.1.0", "einops >= 0.7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/peft_cir"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, UP: pyupgrade, I: isort
select = ["E", "F", "UP", "I"]
isort = { known-first-party = ['peft_cir', 'tests', 'tools'] }
pydocstyle = { convention = 'google' }

[tool.coverage.run]
source = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
